$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.internal.example/sem/runner/v1/message.schema.json
title: Runner–SEM WSS application message
description: >-
  Strict application-frame contract after the authenticated handshake.
  Every message type has a dedicated payload schema; pre-session handshake
  frames are defined separately.
type: object
required: [protocol, schema_version, message_id, message_type, runner_id, connection_id, session_generation, message_sequence, occurred_at, payload]
properties:
  protocol: { const: sem.runner.v1 }
  schema_version: { const: 1 }
  message_id: { type: string, format: uuid }
  message_type:
    enum: [runner.heartbeat, runner.health_probe, runner.health_report, runner.resources.report, runner.admission.changed, execution.deliver, execution.credential_bootstrap, execution.delivery_received, harness.starting, harness.started, harness.start_failed, harness.process_exited, execution.release, execution.release_applied, protocol.ack, protocol.error, runner.session.superseded, runner.replay.request, runner.replay.snapshot]
  runner_id: { type: string, format: uuid }
  connection_id: { type: string, format: uuid }
  session_generation: { type: integer, minimum: 1 }
  message_sequence: { type: integer, minimum: 1 }
  journal_id: { type: string, format: uuid }
  event_sequence: { type: integer, minimum: 1 }
  occurred_at: { type: string, format: date-time }
  in_reply_to: { type: string, format: uuid }
  replayed: { type: boolean, default: false }
  payload: { type: object }
allOf:
  - if: { properties: { message_type: { enum: [execution.delivery_received, harness.starting, harness.started, harness.start_failed, harness.process_exited, execution.release_applied, runner.admission.changed] } }, required: [message_type] }
    then: { required: [journal_id, event_sequence] }
  - if: { properties: { message_type: { const: runner.heartbeat } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/Heartbeat' } } }
  - if: { properties: { message_type: { const: runner.health_probe } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/HealthProbe' } } }
  - if: { properties: { message_type: { const: runner.health_report } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/HealthReport' } } }
  - if: { properties: { message_type: { const: runner.resources.report } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ResourcesReport' } } }
  - if: { properties: { message_type: { const: runner.admission.changed } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/AdmissionChanged' } } }
  - if: { properties: { message_type: { const: execution.deliver } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ExecutionDeliver' } } }
  - if: { properties: { message_type: { const: execution.credential_bootstrap } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/CredentialBootstrap' } } }
  - if: { properties: { message_type: { const: execution.delivery_received } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/DeliveryReceived' } } }
  - if: { properties: { message_type: { const: harness.starting } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/HarnessStarting' } } }
  - if: { properties: { message_type: { const: harness.started } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/HarnessStarted' } } }
  - if: { properties: { message_type: { const: harness.start_failed } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/HarnessStartFailed' } } }
  - if: { properties: { message_type: { const: harness.process_exited } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/HarnessProcessExited' } } }
  - if: { properties: { message_type: { const: execution.release } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ExecutionRelease' } } }
  - if: { properties: { message_type: { const: execution.release_applied } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ReleaseApplied' } } }
  - if: { properties: { message_type: { const: protocol.ack } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ProtocolAck' } } }
  - if: { properties: { message_type: { const: protocol.error } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ProtocolError' } } }
  - if: { properties: { message_type: { const: runner.session.superseded } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/SessionSuperseded' } } }
  - if: { properties: { message_type: { const: runner.replay.request } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ReplayRequest' } } }
  - if: { properties: { message_type: { const: runner.replay.snapshot } }, required: [message_type] }
    then: { properties: { payload: { $ref: '#/$defs/ReplaySnapshot' } } }
  - not:
      properties:
        message_type: { enum: [runner.challenge, runner.auth.proof, runner.session.established] }
      required: [message_type]
additionalProperties: false
$defs:
  Heartbeat:
    type: object
    required: [boot_id, supervisor_state, accepting_work, draining, active_execution_count, process_registry_state]
    properties:
      boot_id: { type: string, minLength: 1 }
      supervisor_state: { enum: [healthy, degraded, failed, unknown] }
      accepting_work: { type: boolean }
      draining: { type: boolean }
      active_execution_count: { type: integer, minimum: 0 }
      process_registry_state: { enum: [consistent, inconsistent, recovering, unknown] }
      resource_report_id: { type: string, format: uuid }
      runner_monotonic_uptime_ms: { type: integer, minimum: 0 }
    additionalProperties: false
  HealthProbe:
    type: object
    required: [probe_id, issued_at, deadline_at]
    properties:
      probe_id: { type: string, format: uuid }
      issued_at: { type: string, format: date-time }
      deadline_at: { type: string, format: date-time }
    additionalProperties: false
  HealthReport:
    type: object
    required: [probe_id, boot_id, supervisor_state, process_registry_state, observed_at]
    properties:
      probe_id: { type: string, format: uuid }
      boot_id: { type: string, minLength: 1 }
      supervisor_state: { enum: [healthy, degraded, failed, unknown] }
      process_registry_state: { enum: [consistent, inconsistent, recovering, unknown] }
      observed_at: { type: string, format: date-time }
      detail_code: { type: string, maxLength: 64 }
    additionalProperties: false
  ResourcesReport:
    type: object
    required: [boot_id, resource_report_id, observed_at, cpu, memory, workspace_volume, execution_capacity]
    properties:
      boot_id: { type: string, minLength: 1 }
      resource_report_id: { type: string, format: uuid }
      observed_at: { type: string, format: date-time }
      cpu:
        type: object
        required: [logical_cores, utilization_ratio, available_millicores]
        properties:
          logical_cores: { type: integer, minimum: 1 }
          utilization_ratio: { type: number, minimum: 0, maximum: 1 }
          available_millicores: { type: integer, minimum: 0 }
        additionalProperties: false
      memory:
        type: object
        required: [total_bytes, available_bytes]
        properties:
          total_bytes: { type: integer, minimum: 1 }
          available_bytes: { type: integer, minimum: 0 }
        additionalProperties: false
      workspace_volume:
        type: object
        required: [volume_id, total_bytes, available_bytes, reserved_bytes]
        properties:
          volume_id: { type: string, minLength: 1 }
          total_bytes: { type: integer, minimum: 1 }
          available_bytes: { type: integer, minimum: 0 }
          reserved_bytes: { type: integer, minimum: 0 }
        additionalProperties: false
      execution_capacity:
        type: object
        required: [max_concurrent, active, accepting]
        properties:
          max_concurrent: { type: integer, minimum: 0 }
          active: { type: integer, minimum: 0 }
          accepting: { type: boolean }
        additionalProperties: false
    additionalProperties: false
  AdmissionChanged:
    type: object
    required: [boot_id, admission_state, accepting_work, reason_code, changed_at]
    properties:
      boot_id: { type: string, minLength: 1 }
      admission_state: { enum: [accepting, draining, disabled, quarantined] }
      accepting_work: { type: boolean }
      reason_code: { type: string, minLength: 1, maxLength: 64 }
      reason_detail: { type: string, maxLength: 512 }
      changed_at: { type: string, format: date-time }
    additionalProperties: false
  ExecutionDeliver:
    type: object
    required: [execution_id, delivery_id, binding_epoch, harness_profile, prompt]
    properties:
      execution_id: { type: string, format: uuid }
      delivery_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      harness_profile: { type: string, minLength: 1, maxLength: 64 }
      prompt:
        type: object
        required: [content_type, body]
        properties:
          content_type: { type: string, minLength: 1, maxLength: 128 }
          body: { type: string, minLength: 1 }
        additionalProperties: false
    additionalProperties: false
  CredentialBootstrap:
    type: object
    required: [execution_id, delivery_id, binding_epoch, bootstrap_ticket, expires_at, audience]
    properties:
      execution_id: { type: string, format: uuid }
      delivery_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      bootstrap_ticket: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
      expires_at: { type: string, format: date-time }
      audience: { type: string, minLength: 1 }
    additionalProperties: false
  DeliveryReceived:
    type: object
    required: [execution_id, delivery_id, binding_epoch, receipt, local_record_id, boot_id]
    properties:
      execution_id: { type: string, format: uuid }
      delivery_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      receipt: { const: durably_recorded }
      local_record_id: { type: string, format: uuid }
      boot_id: { type: string, minLength: 1 }
    additionalProperties: false
  HarnessStarting:
    type: object
    required: [execution_id, binding_epoch, launch_id, containment_id, boot_id]
    properties:
      execution_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      launch_id: { type: string, format: uuid }
      containment_id: { type: string, minLength: 1 }
      boot_id: { type: string, minLength: 1 }
      supervisor_instance_id: { type: string, format: uuid }
    additionalProperties: false
  HarnessStarted:
    type: object
    required: [execution_id, binding_epoch, launch_id, containment_id, process_identity, supervisor_instance_id, boot_id]
    properties:
      execution_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      launch_id: { type: string, format: uuid }
      containment_id: { type: string, minLength: 1 }
      supervisor_instance_id: { type: string, format: uuid }
      boot_id: { type: string, minLength: 1 }
      process_identity:
        type: object
        required: [pid, process_start_identity, cgroup_path, systemd_invocation_id]
        properties:
          pid: { type: integer, minimum: 1 }
          process_start_identity: { type: string, minLength: 1 }
          cgroup_path: { type: string, minLength: 1 }
          systemd_invocation_id: { type: string, minLength: 1 }
        additionalProperties: false
    additionalProperties: false
  HarnessStartFailed:
    type: object
    required: [execution_id, binding_epoch, launch_id, containment_id, boot_id, failure_code, retry_disposition]
    properties:
      execution_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      launch_id: { type: string, format: uuid }
      containment_id: { type: string, minLength: 1 }
      boot_id: { type: string, minLength: 1 }
      failure_code: { type: string, minLength: 1, maxLength: 64 }
      detail_redacted: { type: string, maxLength: 512 }
      retry_disposition: { enum: [not_retryable, retry_same_runner_after_reconcile, operator_required] }
    additionalProperties: false
  HarnessProcessExited:
    type: object
    required: [execution_id, binding_epoch, launch_id, containment_id, boot_id, systemd_invocation_id, cgroup_populated, evidence_id, exit_status, supervisor_instance_id]
    properties:
      execution_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      launch_id: { type: string, format: uuid }
      containment_id: { type: string, minLength: 1 }
      boot_id: { type: string, minLength: 1 }
      systemd_invocation_id: { type: string, minLength: 1 }
      cgroup_populated: { const: 0 }
      evidence_id: { type: string, format: uuid }
      exit_status:
        oneOf:
          - type: object
            required: [kind, code]
            properties: { kind: { const: code }, code: { type: integer } }
            additionalProperties: false
          - type: object
            required: [kind, signal]
            properties: { kind: { const: signal }, signal: { type: integer, minimum: 1 } }
            additionalProperties: false
          - type: object
            required: [kind]
            properties: { kind: { const: unknown } }
            additionalProperties: false
      supervisor_instance_id: { type: string, format: uuid }
      exit_observed_at: { type: string, format: date-time }
    additionalProperties: false
  ExecutionRelease:
    type: object
    required: [execution_id, release_id, expected_binding_epoch, stop_policy]
    properties:
      execution_id: { type: string, format: uuid }
      release_id: { type: string, format: uuid }
      expected_binding_epoch: { type: integer, minimum: 1 }
      stop_policy:
        type: object
        required: [mode, grace_period_seconds]
        properties:
          mode: { enum: [graceful_then_force, force] }
          grace_period_seconds: { type: integer, minimum: 0, maximum: 3600 }
        additionalProperties: false
    additionalProperties: false
  ReleaseApplied:
    type: object
    required: [execution_id, release_id, binding_epoch, disposition, stop_fence_id, observed_at]
    properties:
      execution_id: { type: string, format: uuid }
      release_id: { type: string, format: uuid }
      binding_epoch: { type: integer, minimum: 1 }
      disposition: { enum: [stop_fenced, process_stopped, already_exited, stale_rejected, local_uncertain] }
      stop_fence_id: { type: string, format: uuid }
      process_exit_evidence_id: { type: string, format: uuid }
      observed_at: { type: string, format: date-time }
      detail_code: { type: string, maxLength: 64 }
    additionalProperties: false
  ProtocolAck:
    type: object
    required: [acknowledged_message_id, disposition]
    properties:
      acknowledged_message_id: { type: string, format: uuid }
      acknowledged_event_sequence: { type: integer, minimum: 1 }
      disposition: { enum: [accepted, duplicate, durably_recorded, rejected] }
    additionalProperties: false
  ProtocolError:
    type: object
    required: [code, class, retryable, detail]
    properties:
      code: { type: string, minLength: 1, maxLength: 64 }
      class: { enum: [auth, protocol, conflict, admission, transient, uncertain, compatibility] }
      retryable: { type: boolean }
      retry_after_ms: { type: [integer, 'null'], minimum: 0 }
      detail: { type: string, maxLength: 512 }
    additionalProperties: false
  SessionSuperseded:
    type: object
    required: [superseded_connection_id, superseded_session_generation, reason]
    properties:
      superseded_connection_id: { type: string, format: uuid }
      superseded_session_generation: { type: integer, minimum: 1 }
      reason: { enum: [newer_session_authenticated, administrative_disconnect, key_revoked] }
    additionalProperties: false
  ReplayRequest:
    type: object
    required: [boot_id, journal_id, last_durable_event_sequence, active_executions, process_registry_digest]
    properties:
      boot_id: { type: string, minLength: 1 }
      journal_id: { type: string, format: uuid }
      last_durable_event_sequence: { type: integer, minimum: 0 }
      active_executions:
        type: array
        maxItems: 10000
        items:
          type: object
          required: [execution_id, binding_epoch, launch_id, local_state]
          properties:
            execution_id: { type: string, format: uuid }
            binding_epoch: { type: integer, minimum: 1 }
            launch_id: { type: string, format: uuid }
            local_state: { enum: [recorded, starting, running, stopping, exited, uncertain] }
          additionalProperties: false
      process_registry_digest: { type: string, minLength: 32, maxLength: 256 }
    additionalProperties: false
  ReplaySnapshot:
    type: object
    required: [snapshot_id, journal_id, sem_last_accepted_event_sequence, outstanding_executions, generated_at]
    properties:
      snapshot_id: { type: string, format: uuid }
      journal_id: { type: string, format: uuid }
      sem_last_accepted_event_sequence: { type: integer, minimum: 0 }
      outstanding_executions:
        type: array
        maxItems: 10000
        items:
          type: object
          required: [execution_id, binding_epoch, infrastructure_state]
          properties:
            execution_id: { type: string, format: uuid }
            binding_epoch: { type: integer, minimum: 1 }
            delivery_id: { type: string, format: uuid }
            release_id: { type: string, format: uuid }
            infrastructure_state: { enum: [accepted, queued, reserved, bound, delivering, delivery_received, starting, running, release_requested, stopping, released, delivery_failed, start_failed, infrastructure_uncertain, cleanup_failed] }
          additionalProperties: false
      generated_at: { type: string, format: date-time }
    additionalProperties: false
