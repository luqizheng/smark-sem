$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.internal.example/sem/runner/v1/handshake.schema.json
title: Runner–SEM WSS authentication handshake
description: Draft pre-session challenge/proof/session schemas; Ed25519 and JCS transcript are proposed, not ratified.
oneOf:
  - $ref: '#/$defs/Challenge'
  - $ref: '#/$defs/AuthenticationProof'
  - $ref: '#/$defs/SessionEstablished'
  - $ref: '#/$defs/SessionAcknowledgement'
$defs:
  Challenge:
    type: object
    required: [handshake, message_type, challenge_id, server_nonce, audience, endpoint_authority, issued_at, expires_at, supported_protocol_versions]
    properties:
      handshake: { const: sem.runner.handshake.v1 }
      message_type: { const: runner.challenge }
      challenge_id: { type: string, format: uuid }
      server_nonce: { type: string, contentEncoding: base64url, minLength: 43, maxLength: 43 }
      audience: { type: string, minLength: 1 }
      endpoint_authority: { type: string, minLength: 1 }
      issued_at: { type: string, format: date-time }
      expires_at: { type: string, format: date-time }
      supported_protocol_versions: { type: array, minItems: 1, items: { type: string }, uniqueItems: true }
    additionalProperties: false
  AuthenticationProof:
    type: object
    required: [handshake, message_type, runner_id, key_version, challenge_id, client_nonce, selected_protocol_version, signature]
    properties:
      handshake: { const: sem.runner.handshake.v1 }
      message_type: { const: runner.auth.proof }
      runner_id: { type: string, format: uuid }
      key_version: { type: integer, minimum: 1 }
      challenge_id: { type: string, format: uuid }
      client_nonce: { type: string, contentEncoding: base64url, minLength: 43, maxLength: 43 }
      selected_protocol_version: { type: string, minLength: 1 }
      signature: { type: string, contentEncoding: base64url, minLength: 86, maxLength: 86 }
    additionalProperties: false
  SessionEstablished:
    type: object
    required: [handshake, message_type, runner_id, connection_id, session_generation, protocol, heartbeat_policy]
    properties:
      handshake: { const: sem.runner.handshake.v1 }
      message_type: { const: runner.session.established }
      runner_id: { type: string, format: uuid }
      connection_id: { type: string, format: uuid }
      session_generation: { type: integer, minimum: 1 }
      protocol: { const: sem.runner.v1 }
      heartbeat_policy:
        type: object
        required: [heartbeat_interval_ms, suspect_after_ms, stale_after_ms]
        properties:
          heartbeat_interval_ms: { type: integer, minimum: 1000 }
          suspect_after_ms: { type: integer, minimum: 1000 }
          stale_after_ms: { type: integer, minimum: 1000 }
        additionalProperties: false
    additionalProperties: false
  SessionAcknowledgement:
    type: object
    required: [handshake, message_type, runner_id, connection_id, session_generation]
    properties:
      handshake: { const: sem.runner.handshake.v1 }
      message_type: { const: runner.session.ack }
      runner_id: { type: string, format: uuid }
      connection_id: { type: string, format: uuid }
      session_generation: { type: integer, minimum: 1 }
    additionalProperties: false
