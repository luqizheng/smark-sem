  responses:
    SignedPlatformError:
      description: >-
        Authenticated application response. MUST carry Content-Digest, Signature-Input,
        Signature and exactly one X-SEM-Request-Id equal to the authenticated Idempotency-Key/request_id.
        The body is ProtocolErrorEnvelope and the response signature is bound to the exact originating request context.
      headers:
        Content-Digest: { required: true, schema: { type: string } }
        Signature-Input: { required: true, schema: { type: string } }
        Signature: { required: true, schema: { type: string } }
        X-SEM-Request-Id:
          required: true
          description: Exact authenticated request_id (Idempotency-Key); never message_id.
          schema: { type: string, format: uuid }
      content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolErrorEnvelope' } } }
    SignedCallbackError:
      description: >-
        Authenticated callback response. MUST carry Content-Digest, Signature-Input,
        Signature and exactly one X-SEM-Event-Id equal to the authenticated Idempotency-Key. A valid event has the same event_id; on a signed validation error the header value remains the sole correlation source.
        The body is ProtocolErrorEnvelope and the response signature is bound to the exact originating request context.
      headers:
        Content-Digest: { required: true, schema: { type: string } }
        Signature-Input: { required: true, schema: { type: string } }
        Signature: { required: true, schema: { type: string } }
        X-SEM-Event-Id:
          required: true
          description: Exact authenticated Idempotency-Key; never an unverified body event_id.
          schema: { type: string, format: uuid }
      content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolErrorEnvelope' } } }
    PreAuthenticationError:
      description: >-
        Failure before a trustworthy authenticated request context exists (invalid/missing signature,
        unknown key, stale/replayed nonce, or an early body-size rejection before full-body digest
        verification). No protocol signature headers or request/event correlation headers are present;
        the body MUST NOT contain message_id, in_reply_to, request_id or event_id.
      content: { application/json: { schema: { $ref: '#/components/schemas/PreAuthenticationErrorEnvelope' } } }
    SignedPlatformRateLimitError:
      description: Authenticated Platform request rate limit. Same signature/correlation requirements as SignedPlatformError; Retry-After is mandatory.
      headers:
        Content-Digest: { required: true, schema: { type: string } }
        Signature-Input: { required: true, schema: { type: string } }
        Signature: { required: true, schema: { type: string } }
        X-SEM-Request-Id: { required: true, schema: { type: string, format: uuid } }
        Retry-After:
          required: true
          description: HTTP-date or delay-seconds as defined by HTTP semantics.
          schema: { type: string }
      content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolErrorEnvelope' } } }
    SignedCallbackRateLimitError:
      description: Authenticated SEM callback rate limit. Same signature/correlation requirements as SignedCallbackError; Retry-After is mandatory.
      headers:
        Content-Digest: { required: true, schema: { type: string } }
        Signature-Input: { required: true, schema: { type: string } }
        Signature: { required: true, schema: { type: string } }
        X-SEM-Event-Id: { required: true, schema: { type: string, format: uuid } }
        Retry-After:
          required: true
          description: HTTP-date or delay-seconds as defined by HTTP semantics.
          schema: { type: string }
      content: { application/json: { schema: { $ref: '#/components/schemas/ProtocolErrorEnvelope' } } }
