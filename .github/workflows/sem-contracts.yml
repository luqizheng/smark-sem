name: SEM Protocol Contract Validation

on:
  pull_request:
    paths:
      - "docs/protocol/**"
      - "scripts/validate_sem_contracts.py"
      - ".github/workflows/sem-contracts.yml"
  push:
    branches:
      - docs/sem-d05-lifecycle-crash-consistency
    paths:
      - "docs/protocol/**"
      - "scripts/validate_sem_contracts.py"
      - ".github/workflows/sem-contracts.yml"

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenAPI 3.1 and external references
        run: npx --yes @redocly/cli@1.27.1 lint docs/protocol/openapi/platform-sem-v1-draft.yaml --extends=spec
      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 jsonschema==4.23.0
      - name: Validate JSON Schema meta-schemas and message coverage
        run: python scripts/validate_sem_contracts.py
